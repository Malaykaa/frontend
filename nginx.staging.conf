# Resolver DNS interne Docker — résout l'upstream à la requête, pas au démarrage
# Permet à nginx de démarrer même si backend-staging est temporairement absent.
resolver 127.0.0.11 valid=10s ipv6=off;

# Chaque page du tableau de bord admin (/admin/services, /admin/users...)
# porte EXACTEMENT le même chemin que les appels API correspondants
# (/admin/services/stats, /admin/users...). Un simple préfixe ne peut pas
# distinguer « le navigateur charge cette page » de « le SPA déjà chargé
# interroge cette API » — il faut le signal que le navigateur fournit
# lui-même : Sec-Fetch-Dest vaut "document" uniquement pour une navigation
# (barre d'adresse, rechargement, lien), jamais pour un fetch() du SPA.
map $http_sec_fetch_dest $is_navigation {
    default   0;
    document  1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Routes backend staging
    location ~ ^/(auth|users|profile|chat|ai|goals|plans|documents|files|opportunities|recommendations|trends|notifications|health|services|push)(/|$) {
        set $upstream_backend_staging backend-staging:8000;
        proxy_pass http://$upstream_backend_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # /admin — même principe, mais une navigation directe doit servir la page
    # (SPA) plutôt que d'être proxifiée : voir le commentaire sur `map` en
    # tête de fichier.
    location ~ ^/admin(/|$) {
        if ($is_navigation) {
            rewrite ^ /index.html last;
        }
        set $upstream_backend_staging_admin backend-staging:8000;
        proxy_pass http://$upstream_backend_staging_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # /structures — même ambiguïté que /admin, cf. nginx.production.conf pour
    # le détail : ce préfixe sert à la fois l'API backend et des pages SPA au
    # chemin identique (ClassroomDetailPage, InviteAcceptPage...).
    location ~ ^/structures(/|$) {
        if ($is_navigation) {
            rewrite ^ /index.html last;
        }
        set $upstream_backend_staging_structures backend-staging:8000;
        proxy_pass http://$upstream_backend_staging_structures;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        set $upstream_backend_staging_api backend-staging:8000;
        proxy_pass http://$upstream_backend_staging_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
