name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

  deploy-staging:
    name: Deploy — staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.malayka.co
    steps:
      - uses: actions/checkout@v4

      # nginx.staging.conf est monté en volume, pas intégré à l'image Docker :
      # un `docker pull` + redémarrage du conteneur ne le met jamais à jour tout
      # seul. Sans cette étape, un changement de routage nginx pousse bien sur
      # GitHub mais n'atteint jamais le serveur — c'est resté invisible jusqu'à
      # ce qu'un module entier (Services) découvre le trou.
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "nginx.staging.conf"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd ${{ secrets.DEPLOY_PATH }}
            docker pull "${IMAGE}:develop"
            FRONTEND_IMAGE="${IMAGE}" IMAGE_TAG=develop \
              docker compose -f docker-compose.yml -f docker-compose.staging.yml \
              up -d --no-build frontend-staging
            # Recharge nginx explicitement : si seul le fichier de config a
            # changé (aucune modification de l'image), Compose peut décider
            # que rien ne justifie de recréer le conteneur, et le nouveau
            # fichier resterait sur disque sans jamais être pris en compte.
            docker compose -f docker-compose.yml -f docker-compose.staging.yml \
              exec -T frontend-staging nginx -s reload
            docker image prune -f

  deploy-production:
    name: Deploy — production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://malayka.co
    steps:
      - uses: actions/checkout@v4

      # Même raison qu'en staging : nginx.production.conf est un volume, pas
      # une couche de l'image. C'est ce qui a fait qu'un correctif de routage
      # fusionné dans main n'atteignait jamais malayka.co.
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "nginx.production.conf"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd ${{ secrets.DEPLOY_PATH }}
            docker pull "${IMAGE}:latest"
            FRONTEND_IMAGE="${IMAGE}" IMAGE_TAG=latest \
              docker compose up -d --no-build frontend
            # Même précaution qu'en staging : forcer la prise en compte du
            # fichier de config sans dépendre de la recréation du conteneur.
            docker compose exec -T frontend nginx -s reload
            docker image prune -f
