# Chaque page du tableau de bord admin (/admin/services, /admin/users...)
# porte EXACTEMENT le même chemin que les appels API correspondants
# (/admin/services/stats, /admin/users...). Un simple préfixe ne peut pas
# distinguer « le navigateur charge cette page » de « le SPA déjà chargé
# interroge cette API » — il faut le signal que le navigateur fournit
# lui-même : Sec-Fetch-Dest vaut "document" uniquement pour une navigation
# (barre d'adresse, rechargement, lien), jamais pour un fetch() du SPA.
map $http_sec_fetch_dest $is_navigation {
    default   0;
    document  1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Routes backend — proxy vers FastAPI (VITE_API_URL est vide, URLs relatives)
    location ~ ^/(auth|users|profile|chat|ai|goals|plans|documents|files|opportunities|recommendations|trends|notifications|health|services|structures|push)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # /admin — même principe, mais une navigation directe doit servir la page
    # (SPA) plutôt que d'être proxifiée : voir le commentaire sur `map`
    # ci-dessus.
    location ~ ^/admin(/|$) {
        if ($is_navigation) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # /api/ — alias avec suppression du préfixe (swagger, openapi.json)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # SPA — toutes les autres routes renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
