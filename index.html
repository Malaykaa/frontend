    <!-- Typographie de marque. Bricolage Grotesque reprend l'assurance un peu
         condensee du logotype sans l'imiter ; Public Sans porte le texte courant ;
         IBM Plex Mono sert aux libelles et aux donnees. Aucune des trois n'est
         une police "par defaut" — c'est ce qui evite l'effet gabarit. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Barre d'etat PWA a la couleur de la marque (etait l'indigo par defaut). -->
    <meta name="theme-color" content="#141416" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="mobile-web-app-capable" content="yes" />
